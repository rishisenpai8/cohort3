<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>Pokedex</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Pokedex</h1>
      <div class="search-box">
        <input type="search for your favourite pokemon..." id="input" style="height: 2rem; width: 15rem; border-radius: 0.3rem;"> 
        <button id="search-btn" onclick="getPokemonData()" style="height: 2rem; width: 5rem; padding: 0.4rem; cursor: pointer; border-radius: 0.3rem;">Search</button>
      </div>

      <div class="poke-container" id="poke-container">
        
          <div class="image-container">
            <img id="pokemon-img" src="/week3/medium/download.png" alt=""/> 
          </div>

          <div class="info">
            <div class="pokemon-info">
              <span id="number"></span>
              <h3 id="name">Pokemon Name</h3>
              <small class="height">height: <span id="height"></span>Ft</small>
              <small class="weight">weight: <span id="weight"></span>Lbs</small>
            </div>

            
          </div>

        </div>
      </div>
    </div>
    
    <script src="app.js"></script>
  </body>
</html>
