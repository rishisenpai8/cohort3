<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drag and Drop Html CSS</title>
    <link rel="stylesheet" href="style1.css">
</head>
<body>
    <div class="container">


        <div class="item" id="todo">
            <h3>New To-Do Here</h3>
            <div class="task-elements">
                <ul id="todo-list">
                    
                </ul>
            </div>
            <div class="input-task">
                <input type="text" id="todo-input">
                <button id="todo-btn">+ Add Todo</button>
            </div>
        </div>


        <div class="item" id="active">
            <h3>Active</h3>
            <div class="task-elements">
                <ul id="active-list">
                    
                </ul>
            </div>
            <div class="input-task">
                <input type="text" id="active-input">
                <button id="active-btn">+ Add Todo</button>
            </div>
        </div>


        <div class="item" id="progress">
            <h3>In Progress</h3>
            <div class="task-elements">
                <ul id="progress-list">
                   
                </ul>
            </div>        
            <div class="input-task">
                <input type="text" id="progress-input">
                <button id="progress-btn">+ Add Todo</button>
            </div>
         </div>
         
         
        <div class="item" id="completed">
            <h3>Completed</h3>
            <div class="task-elements">
                <ul id="complete-list">
                 
                </ul>
            </div>
            <div class="input-task">
                <input type="text" id="complete-input">
                <button id="complete-btn">+ Add Todo</button>
            </div>
        </div>
    </div>


    <script src="app1.js"></script>
</body>
</html>
